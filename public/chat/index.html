<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Desk — Chat</title>
<style>body{font-family:system-ui,sans-serif;max-width:800px;margin:0 auto;padding:20px;background:#f5f7fb;color:#172033}header{display:flex;justify-content:space-between;align-items:center}.chat{min-height:55vh;background:white;border-radius:16px;padding:16px;margin:16px 0}.bubble{max-width:75%;padding:10px 14px;border-radius:14px;margin:10px 0;white-space:pre-wrap}.user{background:#dceafe;margin-left:auto}.assistant{background:#eef0f4}.controls,form{display:flex;gap:8px;flex-wrap:wrap}textarea{flex:1;padding:12px;border:1px solid #ccd3df;border-radius:10px}button,select,input{padding:10px;border:1px solid #ccd3df;border-radius:8px}button{background:#2563eb;color:white}</style></head>
<body><header><h1>💬 Chat</h1><a href="/">หน้าหลัก</a></header><div class="controls"><select id="provider"><option value="gemini">Gemini</option><option value="openai">OpenAI</option><option value="openai-compat">Custom gateway</option></select><input id="model" placeholder="ชื่อโมเดล (ไม่บังคับ)"></div><main class="chat" id="chat"></main><form id="form"><textarea id="message" rows="2" placeholder="พิมพ์ข้อความ..."></textarea><button>ส่ง</button></form><script src="/chat/app.js"></script></body></html>
